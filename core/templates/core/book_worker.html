{% extends 'core/base.html' %}

{% block title %}Approve Users{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center">Pending Users</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        <ul class="list-group">
            {% for user in users %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ user.username }}
                    <button type="submit" name="user_id" value="{{ user.id }}" class="btn btn-success btn-sm">Approve</button>
                </li>
            {% endfor %}
        </ul>
    </form>
</div>
{% endblock %}
