{% extends 'core/base.html' %}

{% block title %}Register{% endblock %}

{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center">Register</h2>
    <div class="row justify-content-center mt-3">
        <div class="col-md-6"> <!-- Restrict form width to 6 columns on medium screens -->
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary w-100">Register</button> <!-- Full-width button -->
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'login' %}" class="btn btn-link">Already have an account? Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
