{% extends 'core/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center">Login</h2>
    <div class="row justify-content-center mt-3">
        <div class="col-md-6"> <!-- Restrict form width to 6 columns on medium screens -->
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button> <!-- Full-width button -->
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'register' %}" class="btn btn-link">Don't have an account? Register</a>
            </div>
        </div>
    </div>
    {% if messages %}
        <div class="mt-3">
            <ul class="list-group">
                {% for message in messages %}
                    <li class="list-group-item list-group-item-warning">{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
</div>
{% endblock %}
